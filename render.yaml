services:
  - type: web
    name: nothing
    runtime: static
    staticPublishPath: ./public
    headers:
      - path: /*.js
        name: Cache-Control
        value: public, max-age=3600
      - path: /*.css
        name: Cache-Control
        value: public, max-age=3600
      - path: /*.png
        name: Cache-Control
        value: public, max-age=31536000
      - path: /*.svg
        name: Cache-Control
        value: public, max-age=31536000
      - path: /*.ico
        name: Cache-Control
        value: public, max-age=31536000